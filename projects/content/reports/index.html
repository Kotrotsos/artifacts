<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Working in the Age of Agents — A Practitioner's Course</title>
<style>
  :root{
    --bg:#ffffff; --panel:#faf9f7; --panel2:#f1efea; --text:#1a1a1a; --muted:#6b6678;
    --line:#1a1a1a; --soft:#e3e0d9; --coral:#E55A4D; --good:#3a9d5d;
    --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    --mono:"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  }
  html[data-theme="dark"]{
    --bg:#16141f; --panel:#1e1b2a; --panel2:#26223a; --text:#ece9f4; --muted:#9a93ad;
    --line:#3a3550; --soft:#2c2840; --coral:#f08a78; --good:#6fc88a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--ui);line-height:1.6;-webkit-font-smoothing:antialiased;}
  a{color:var(--coral);text-decoration:none;}

  .layout{display:grid;grid-template-columns:320px 1fr;min-height:100vh;}
  /* sidebar */
  .side{border-right:2px solid var(--line);background:var(--panel);position:sticky;top:0;height:100vh;overflow-y:auto;padding:22px 18px 40px;}
  .brand{font-size:18px;font-weight:800;letter-spacing:-.01em;line-height:1.2;margin-bottom:3px;}
  .brand .by{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-top:4px;}
  .prog{margin:16px 0 8px;}
  .progbar{height:9px;background:var(--panel2);border:2px solid var(--line);border-radius:6px;overflow:hidden;}
  .progfill{height:100%;background:var(--coral);width:0;transition:width .3s;}
  .progtxt{font-size:12px;color:var(--muted);margin-top:6px;font-weight:600;}
  .reset{font-size:11px;color:var(--muted);cursor:pointer;float:right;border-bottom:1px dotted var(--muted);}
  .navhome{display:block;width:100%;text-align:left;border:2px solid var(--line);background:var(--bg);color:var(--text);
    font:700 13px var(--ui);padding:9px 12px;border-radius:9px;cursor:pointer;margin:14px 0 18px;}
  .navhome:hover{background:var(--panel2);}
  .mod{margin-bottom:6px;}
  .modh{font:700 12px var(--mono);letter-spacing:.03em;color:var(--muted);text-transform:uppercase;padding:8px 6px 4px;}
  .lesson{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:14px;color:var(--text);}
  .lesson:hover{background:var(--panel2);}
  .lesson.active{background:var(--coral);color:#fff;font-weight:600;}
  .lesson .tick{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--muted);display:flex;align-items:center;justify-content:center;font-size:11px;}
  .lesson.done .tick{background:var(--good);border-color:var(--good);color:#fff;}
  .lesson.active .tick{border-color:#fff;}
  .lesson.active.done .tick{background:#fff;color:var(--good);border-color:#fff;}

  /* main */
  .main{padding:0;}
  .topbar{display:flex;justify-content:flex-end;gap:4px;padding:14px 28px;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--soft);}
  .toggle{display:flex;gap:3px;background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:3px;}
  .toggle button{border:0;background:transparent;color:var(--muted);font:600 12px var(--ui);padding:6px 12px;border-radius:999px;cursor:pointer;}
  .toggle button.active{background:var(--line);color:var(--bg);}
  html[data-theme="dark"] .toggle button.active{background:var(--coral);color:#16141f;}
  .content{max-width:760px;margin:0 auto;padding:34px 28px 90px;}

  /* home */
  .hero{border:2px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:30px;background:var(--panel);}
  .hero img{display:block;width:100%;}
  .h1{font-size:38px;font-weight:850;letter-spacing:-.02em;line-height:1.08;margin-bottom:14px;}
  .lead{font-size:19px;color:var(--muted);margin-bottom:22px;}
  .startbtn{display:inline-block;border:2px solid var(--line);background:var(--coral);color:#fff;font:800 15px var(--ui);
    padding:12px 22px;border-radius:11px;cursor:pointer;margin-bottom:30px;}
  .modcards{display:grid;gap:12px;}
  .modcard{border:2px solid var(--line);border-radius:13px;padding:16px 18px;cursor:pointer;background:var(--panel);}
  .modcard:hover{background:var(--panel2);}
  .modcard h3{font-size:17px;font-weight:780;margin-bottom:4px;}
  .modcard .mn{font:700 11px var(--mono);color:var(--coral);letter-spacing:.05em;text-transform:uppercase;}
  .modcard p{font-size:14px;color:var(--muted);margin-top:4px;}
  .modcard .cnt{font-size:12px;color:var(--muted);font-weight:600;margin-top:8px;}

  /* lesson */
  .crumb{font:700 12px var(--mono);color:var(--coral);letter-spacing:.04em;text-transform:uppercase;margin-bottom:10px;}
  .ltitle{font-size:30px;font-weight:820;letter-spacing:-.01em;line-height:1.12;margin-bottom:20px;}
  .teach p{font-size:17.5px;margin-bottom:15px;}
  .teach strong{font-weight:700;}
  .box{border:2px solid var(--line);border-radius:13px;padding:17px 20px;margin:24px 0;background:var(--panel);}
  .box h4{font:700 12px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}
  .box ul{padding-left:20px;} .box li{font-size:15.5px;margin-bottom:7px;}
  .apply{border-left:5px solid var(--coral);}
  .apply h4{color:var(--coral);}
  .apply p{font-size:16px;}
  .check h4{color:var(--text);}
  .check .q{font-size:16px;font-weight:600;margin-bottom:12px;}
  .revbtn{border:2px solid var(--line);background:var(--bg);color:var(--text);font:700 13px var(--ui);padding:8px 14px;border-radius:9px;cursor:pointer;}
  .revbtn:hover{background:var(--panel2);}
  .answer{display:none;margin-top:13px;font-size:15.5px;color:var(--text);border-top:1px dashed var(--soft);padding-top:12px;}
  .answer.show{display:block;}

  .lfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:34px;border-top:2px solid var(--soft);padding-top:20px;}
  .markbtn{border:2px solid var(--line);background:var(--bg);color:var(--text);font:800 14px var(--ui);padding:11px 18px;border-radius:11px;cursor:pointer;}
  .markbtn.done{background:var(--good);color:#fff;border-color:var(--good);}
  .nav{display:flex;gap:8px;}
  .nav button{border:2px solid var(--line);background:var(--bg);color:var(--text);font:700 13px var(--ui);padding:10px 14px;border-radius:10px;cursor:pointer;}
  .nav button:hover:not(:disabled){background:var(--panel2);}
  .nav button:disabled{opacity:.35;cursor:default;}

  .sitefoot{max-width:760px;margin:0 auto;padding:10px 28px 50px;font-size:13.5px;color:var(--muted);}
  .sitefoot a{color:var(--muted);border-bottom:1px solid var(--soft);}

  .mobtoggle{display:none;}
  @media (max-width:860px){
    .layout{grid-template-columns:1fr;}
    .side{position:static;height:auto;border-right:0;border-bottom:2px solid var(--line);display:none;}
    .side.open{display:block;}
    .mobtoggle{display:inline-block;margin-right:auto;border:2px solid var(--line);background:var(--bg);color:var(--text);font:700 13px var(--ui);padding:7px 13px;border-radius:9px;cursor:pointer;}
    .topbar{justify-content:space-between;}
    .h1{font-size:30px;}
  }
  @media print{
    .side,.topbar,.lfoot,.sitefoot{display:none;}
    .layout{display:block;} .content{max-width:100%;}
    body{background:#fff;color:#000;} .box{break-inside:avoid;border-color:#000;}
    .answer{display:block;}
  }
</style>
</head>

<script>
const COURSE = [
  { m:"Module 1", title:"The Shift", blurb:"Why the daily practice of building changed, and the curve underneath it.", lessons:[
    { id:"1.1", title:"The exponential meets the linear",
      teach:`<p>Model capability is improving on an exponential, and the gaps between jumps keep shrinking. A couple of years ago the frontier was drafting a usable commit message. Then it was building a whole feature unattended. Then running overnight on a long task. Now models read an entire codebase and find a defect that slipped past human review for years.</p>
      <p>Business capability is not on that curve. Most organizations improve in straight lines: a bit more automation this quarter, a slightly faster process next. So the distance between what the model can do and what your company has it doing widens every few months.</p>
      <p>That gap is the whole opportunity of this course. It does not close by waiting for a smarter model. It closes on your side, by changing how you work.</p>`,
      take:["Capability moves exponentially; most adoption moves linearly.","The gap between the two is widening, and it is yours to close.","Every later module is a concrete way to close it."],
      apply:"Name your single most valuable AI use case. Has it improved as fast as the models have in the last six months? If not, the gap is showing up right there.",
      check:{q:"Why does the capability gap keep widening even as models improve?",a:"Because the models climb an exponential while organizations absorb them on a linear. Faster people doing their existing jobs is a few percent of gain; the model is moving far faster than that, so the unused capability compounds."} },
    { id:"1.2", title:"From autocomplete to delegation",
      teach:`<p>There is a ladder worth placing yourself on. A year ago you wrote code by hand with autocomplete finishing your lines. Then you ran several agent sessions in parallel and prompted each one. Now the frontier is writing the program that prompts the agent, then going to do something else.</p>
      <p>The job moved up an altitude each time, from writing the code, to directing the thing that writes the code. The keystrokes left. The judgment stayed. This does not make skilled people less valuable; someone still decides what to build and whether it is good, and that someone matters more, not less.</p>`,
      take:["The work climbs from typing, to prompting, to designing the system that prompts.","Each rung trades keystrokes for judgment.","Skill moves up the ladder; it does not disappear."],
      apply:"Find one task you still do by hand-prompting an agent step by step. That is a candidate to move up a rung into a loop or a routine.",
      check:{q:"What stays with the human as the work climbs the ladder?",a:"Judgment: deciding what to build, setting the standard for good, and checking the result. The mechanical keystrokes move to the model; the decisions stay."} },
    { id:"1.3", title:"Time horizon, the metric that matters",
      teach:`<p>One number explains most of the change: time horizon, how long a model can work on its own before it loses the thread of what it is doing. As that horizon stretches from minutes to hours to days, the unit of work you can hand over changes with it.</p>
      <p>Short horizon means you hand over tasks and stitch the results together yourself. Long horizon means you can hand over a goal and let the model hold it over time, planning across stages and checking its own work. Watching the horizon grow is how you know which kinds of work just became delegable.</p>`,
      take:["Time horizon is how long an agent stays coherent without you.","As it grows, you can delegate goals instead of tasks.","It is a better signal of what changed than any single benchmark score."],
      apply:"For your use case, ask how long an agent runs before you have to step in. That number, not the model's IQ, sets how much you can delegate.",
      check:{q:"What does a longer time horizon let you delegate that a short one does not?",a:"A goal held over time, rather than a single task. Long horizon means the agent can plan across stages, keep a specification in view, and check its own work without losing the thread."} },
    { id:"1.4", title:"Build for the model you will have in six months",
      teach:`<p>The most expensive habit in applied AI is optimizing around the model in front of you. Teams build elaborate scaffolding to compensate for today's weaknesses: a decomposition chain, a retry-and-repair loop, a long system prompt for every edge case. A new model lands and most of it becomes dead weight.</p>
      <p>The counterintuitive rule is that as the model gets more capable, your scaffolding should get thinner, not thicker. A smarter model goes farther with simple primitives, a filesystem, a sandbox, the ability to run its own tests, and less far when trapped in a harness built for weaknesses it no longer has.</p>`,
      take:["Scaffolding built for today's weakness expires on the next upgrade.","Thinner systems on simple primitives absorb new models cleanly.","Before adding a layer, ask if the problem is durable or temporary."],
      apply:"Audit one AI system you own. List the parts that exist only to compensate for a current model limitation. Those are the parts you will tear out next upgrade.",
      check:{q:"Why should scaffolding get thinner as models get smarter?",a:"Because most scaffolding compensates for a specific, temporary weakness. A more capable model handles those cases itself and performs worse when forced through a complex harness, so the compensating layers become liabilities."} },
  ]},
  { m:"Module 2", title:"Loops and Autonomy", blurb:"The mechanics of work that runs itself, and the two things that make it safe.", lessons:[
    { id:"2.1", title:"Stop being the thing in the loop",
      teach:`<p>A loop is a small program that prompts the agent for you, reads what it produced, decides whether it is done, and if not prompts it again. You stop being the thing inside the loop typing prompts. You write the loop, and the model becomes a subroutine.</p>
      <p>The simplest useful version is a few lines of shell that feed a fixed prompt file to a coding agent over and over, resetting context to a known set of anchor files each pass so it does not drift. The productized version is a single command that runs an agent until a stated condition becomes true. You do not need an orchestration framework to start, and you should not begin with one.</p>`,
      take:["A loop prompts the agent so you do not have to.","Start with one small loop, not a framework.","Resetting to fixed anchor files each pass is what stops drift."],
      apply:"Pick one bounded, verifiable task with an objective definition of done. That is your first loop candidate.",
      check:{q:"What is the difference between you prompting an agent and a loop prompting it?",a:"When you prompt, you are inside the loop doing the repetitive driving. When a loop prompts, you have written the driving down once, and your attention moves to defining the goal and checking the result."} },
    { id:"2.2", title:"The judge does not run your tests",
      teach:`<p>Many loops use a second, cheaper model as a judge to decide whether the work is done. The detail almost everyone misses: that judge does not run your tests or read your repo. It only reads what already landed in the conversation.</p>
      <p>So the real verification is still the working agent running a real command, whose output lands in the transcript. The judge only decides whether that receipt says pass. A condition like "all tests in the auth suite pass and the test command exits zero" works because the run shows up in the transcript. "The auth is solid" does not, because nothing settles it. Write conditions a machine can prove, not vibes a model can assert.</p>`,
      take:["The judge grades the transcript, not the world.","Real verification is the agent running a real command.","State conditions whose proof appears in the output."],
      apply:"Rewrite one fuzzy success criterion (\"make it better\") into something with a checkable receipt (\"the suite passes and the build exits zero\").",
      check:{q:"If the judge model does not run your tests, what actually verifies the work?",a:"The working agent running a real check (tests, a build, a health check) whose output lands in the transcript. The judge only reads that output and decides done or not. No real command, no real verification."} },
    { id:"2.3", title:"Guardrails, the three hard stops",
      teach:`<p>An open loop that writes and never stops is a way to generate confident mistakes, faster and faster, and to run up a bill. Every serious loop has the same three hard stops, and you add all three before leaving one running unattended.</p>
      <p>A turn cap stops a runaway after N iterations. A no-progress stop halts when several turns change nothing, usually by checking whether the diff moved. A budget ceiling stops at a hard dollar or token limit, set in your provider's spend controls. The romantic pitch is that you write a loop and a thousand agents build your company overnight. The production reality is that most of the engineering is making sure they halt.</p>`,
      take:["Turn cap, no-progress stop, budget ceiling: add all three.","A turn cap is not a no-progress detector; you need both.","Most of the real work in loops is making them stop."],
      apply:"Before any unattended run, write down its three stops explicitly. If you cannot state the budget ceiling, do not start the run.",
      check:{q:"A turn cap of 20 is set. Why is that not enough on its own?",a:"A turn cap only bounds the count of turns. It does not notice when the agent is stuck making no progress, and it does not bound spend per turn. You still need a no-progress stop and a budget ceiling."} },
    { id:"2.4", title:"Cost per solved task",
      teach:`<p>Once the model writes code for almost nothing, the per-token price stops being the number that matters. The number that matters is cost per solved task. A model that costs double but finishes a hard, long job in one pass can win on cost per outcome while losing on the rate card.</p>
      <p>The discipline that controls this is making loops halt, plus matching the model to the job. A premium model that runs for hours is a bargain on a migration and a waste on a one-line fix. Measure what you actually pay per finished, verified outcome, and route cheap work to cheap models.</p>`,
      take:["Judge models and loops by cost per solved task, not token price.","A pricier model can be cheaper per finished outcome on hard jobs.","Route easy, high-volume work to cheaper models."],
      apply:"For one recurring agent job, estimate cost per solved task, not per token. Decide whether the model tier matches the job's difficulty.",
      check:{q:"How can a model that is twice the per-token price be the cheaper choice?",a:"If it solves a hard, long task in one thorough pass where a cheaper model would loop, fail, and need re-runs or human cleanup. Cost per solved task captures that; the rate card does not."} },
  ]},
  { m:"Module 3", title:"Set the Bar, Hold the Bar", blurb:"The two jobs that stay human when agents take the middle.", lessons:[
    { id:"3.1", title:"The two jobs that stay human",
      teach:`<p>As agents take over the middle of the work, the writing and the executing, two jobs stay with you. You set the bar before the work: specify what done means, what quality counts, what constraints bind. And you hold the bar after it: verify the result actually met the spec, run the checks, refuse to accept vibes.</p>
      <p>Everything between those two ends crossed to the agent. Teams fail with agents not because the model is weak but because nobody set a bar, so vague intent went in, or nobody held it, so unreviewed output came out. The bar is the framework that ties this whole course together.</p>`,
      take:["Set the bar before, hold the bar after; the agent crosses the middle.","Most agent failures are a missing bar on one end.","\"Make it better\" is not a bar."],
      apply:"Take one task you delegate. Write its bar in one sentence a machine or a reviewer could check. If you cannot, that is why the output disappoints.",
      check:{q:"What are the two human jobs, and which one does a code review correspond to?",a:"Setting the bar (specify before) and holding the bar (verify after). A code review is holding the bar, checking that finished work meets the standard before it is accepted."} },
    { id:"3.2", title:"Outcomes, not tasks",
      teach:`<p>Long time horizons let you change what you hand over. Instead of asking an agent to write this week's project update, you give it the job of keeping the project on track for the week and surfacing what needs attention. Instead of asking for a forecast, you tell it to own the forecast, update it as numbers land, and keep it accurate.</p>
      <p>The agent stops producing an artifact on request and starts holding a goal over time. That only works with a rubric: a definition of good clear enough that the agent can measure itself against it and keep iterating until it meets it. The rubric is the bar, made operational.</p>`,
      take:["Hand over goals held over time, not one-off artifacts.","An outcome needs a rubric the agent can check itself against.","The rubric is the bar in operational form."],
      apply:"Convert one recurring task you assign into an outcome you own with a rubric. Write the rubric first; the handover depends on it.",
      check:{q:"What does handing over an outcome require that handing over a task does not?",a:"A rubric, a clear definition of good the agent can measure itself against and iterate toward. Without it, an owned outcome drifts; with it, the agent can hold the goal over time."} },
    { id:"3.3", title:"Rules, skills, and prompts",
      teach:`<p>Three different things all feel like telling the model how to behave, and confusing them is why agents feel bloated or ignorant. Rules are who the agent is: identity and constraints, loaded every session, always on. Skills are what it knows how to do: procedures loaded on demand, cheap to keep and loaded only when their description matches the work. Prompts are what you want right now: one-shot intent.</p>
      <p>Each has a cost model. Put a procedure in your always-on rules and you pay for it every session. Put your identity in a skill and it may never load when it is needed. The rule of thumb: rules are who you are, skills are what you know how to do, prompts are what you want right now.</p>`,
      take:["Rules: always-on identity and constraints.","Skills: on-demand procedures, loaded by description match.","Prompts: one-shot intent. Put content in the right layer."],
      apply:"Look at your longest system prompt. Move the step-by-step procedures into skills and keep only identity and constraints as rules.",
      check:{q:"Why is a 600-line procedure in your always-on rules a problem?",a:"Rules load every session, so you pay their cost constantly even when the procedure is irrelevant. Procedures belong in skills, which load only when their description matches the current work."} },
  ]},
  { m:"Module 4", title:"The AI-Native Company", blurb:"The difference between using AI and running on it.", lessons:[
    { id:"4.1", title:"Using AI vs running on AI",
      teach:`<p>Most organizations bought AI the way they bought every tool before it: a faster way to do the thing people already did. Real gains, entirely linear. An AI-native company is a different architecture. The work itself runs on AI, and the people decide what the outcome should be and check it.</p>
      <p>Picture a product that broke overnight, read its own error reports, wrote the fix, and shipped it before anyone woke up. No standup, no ticket. That only happens when the work runs on the substrate, not when a human still has to notice and assign it. Do not mistake fast tool use for being AI-native; the gap between them is the gap you keep trying to close.</p>`,
      take:["Using AI: people do the work with help. Running on AI: the work runs, people set outcomes.","The overnight self-fix is the tell of the second.","They are different architectures, not two points on one line."],
      apply:"For your top use case, ask: does a human still have to notice and kick off the work? If yes, you are using AI, not running on it.",
      check:{q:"What is the architectural difference between using AI and being AI-native?",a:"Using AI keeps the human in the loop doing the work with assistance. AI-native moves the work onto AI and the human up to deciding and checking outcomes. The work starting and running without a human kicking it off is the marker."} },
    { id:"4.2", title:"Harness, context, infrastructure",
      teach:`<p>A smarter model is necessary and nowhere near sufficient. Three layers turn intelligence into work that runs on its own. The harness is tools, an environment, and permission to act: the brain decides, the hands (sandboxes) execute. Without it you get suggestions, not outcomes.</p>
      <p>Context is what lets an agent improve instead of starting cold: memory it writes to and reads back, skills it can write for itself, and a long window. Infrastructure is the unglamorous part, sandboxes that spin up and down, fleets running in parallel, recovery when a step fails at three in the morning. Miss any one layer and you are back to a chatbot that gives advice.</p>`,
      take:["Harness: permission and hands to act.","Context: memory and skills, so it improves run to run.","Infrastructure: scale and recovery, so it survives reality."],
      apply:"Score your setup on the three layers. The weakest one is why your agents feel like a demo instead of a system.",
      check:{q:"An agent gives great recommendations but never acts on them. Which layer is missing?",a:"The harness. It has intelligence but no tools, environment, or permission to act, so it can only advise. A harness gives it the hands to execute."} },
    { id:"4.3", title:"Managed agents and fleets",
      teach:`<p>You do not have to build the three layers from scratch. Managed agent platforms package the harness, context tools, and production infrastructure so you can run long-lived agents without rolling your own. Teams use them to put agent orchestration inside their own products, so their users can delegate long-running work, and to build agents that work alongside people as teammates that return finished deliverables.</p>
      <p>The organizational tell of this working: a product manager coordinating teams of agents the same way they coordinate teams of people, shipping major releases every two weeks instead of once a quarter. A human still decides what to build and whether it is good. They are managing a workforce that runs on the substrate.</p>`,
      take:["Managed platforms package harness, context, and infrastructure.","Agents can live inside products or work as teammates.","The tell is a human managing a fleet, not doing the work."],
      apply:"Identify one long-running workflow a managed agent could own end to end. Name the human who would manage it and the outcome they would set.",
      check:{q:"What is the human's role once a fleet of agents runs the work?",a:"To manage the fleet: decide what should be built, set the outcomes and rubrics, and hold the bar on quality. They direct a workforce that runs on the substrate rather than doing the tasks themselves."} },
  ]},
  { m:"Module 5", title:"Claude Code as a Platform", blurb:"The surfaces and agent teams that ship code for you.", lessons:[
    { id:"5.1", title:"The four surfaces",
      teach:`<p>Claude Code is now four surfaces over one engine. The CLI is home for power users who want a minimal interface and the most control. The IDE extension is for when you are in the code yourself and want to follow the diffs. The desktop app is a graphical control plane with previews and a single view across local and cloud sessions. The agents view in the terminal is a control plane that never makes you leave it.</p>
      <p>They share the same agent underneath, so you pick the surface that fits the moment, not the one you got stuck with. Once you are running several sessions at once, you need a control plane more than another editor pane, which is exactly what the desktop app and the agents view provide.</p>`,
      take:["Four surfaces, one engine: CLI, IDE, desktop, agents view.","Match the door to the moment.","Running many sessions needs a control plane, not another editor."],
      apply:"Try the surface you have not used. If you live in the CLI, open the desktop control plane and run two sessions at once.",
      check:{q:"Why do the desktop app and agents view matter once you run several agents at once?",a:"Because parallel work needs oversight more than editing. Both are control planes: they show what is running, what is waiting on you, and what is done, so you can supervise many sessions instead of babysitting one."} },
    { id:"5.2", title:"Auto mode and the control plane",
      teach:`<p>The old loop had you approving every edit. Auto mode delegates permissions and lets the agent work until it has something worth your attention, usually a tested change and a pull request ready to read. Your attention moves from the keystrokes to the review.</p>
      <p>This is the single change that unlocks everything else. With it, teams report shipping many times more code, because the bottleneck moved from typing to reviewing. The control plane, in the terminal or the desktop app, is how you keep that supervisable: you see what needs you, reply inline to unblock, and jump in and out of sessions without losing your place.</p>`,
      take:["Auto mode trades approving edits for reviewing PRs.","It is the change that unlocks the rest of the platform.","The control plane keeps parallel work supervisable."],
      apply:"Turn on auto mode for one safe, branch-isolated task. Review the PR it opens instead of the edits it makes.",
      check:{q:"Why is auto mode described as the change that unlocks everything else?",a:"Because it moves your attention from typing to reviewing outcomes. Once you supervise rather than approve each edit, you can run code review, routines, and parallel fleets on top; without it you are still the bottleneck."} },
    { id:"5.3", title:"Agent teams: review, security, routines",
      teach:`<p>Three features run on their own once configured. Code review deploys a team of agents to catch critical bugs in your pull requests; reach for it the moment you merge more than humans can carefully read, which, after auto mode, is almost immediately. A security scan works your codebase overnight, flags vulnerabilities, calls out the most critical, and lets you start a fix session per issue.</p>
      <p>Routines configure a task once and run it on a schedule, a webhook, or an API call, kicking off the agent without a human to start it. This is the home for recurring toil: the weekly bump, the nightly check, the cleanup that always slips. Anything you kick off on a rhythm belongs here.</p>`,
      take:["Code review: an agent team on your PRs.","Security: an overnight scan with a fix session per finding.","Routines: recurring work that starts itself."],
      apply:"List three things you currently kick off manually on a schedule. Each is a routine waiting to be written.",
      check:{q:"Why does adopting auto mode make code review almost mandatory?",a:"Auto mode increases how much code you merge, quickly past what humans can carefully read. The code review agent team catches the critical bugs that your faster pace would otherwise let slip through."} },
    { id:"5.4", title:"Dynamic workflows",
      teach:`<p>Dynamic workflows fan a job out across tens or hundreds of agents at once, in a deterministic structure, for the most ambitious work: large migrations, codebase-wide audits, performance sweeps, anything that means the same shaped work many times.</p>
      <p>The example that makes it click: localizing a site to a dozen languages. One agent does one language in a few minutes; done sequentially that is most of an hour. A workflow runs twelve translation agents in parallel, then spins up twelve more to verify the work, from one prompt, and you can save the whole thing as code and reuse it. Production teams use this to merge over a thousand migration PRs a month and cut migration time by around ninety percent.</p>`,
      take:["Workflows run fleets in a deterministic structure.","Best for big, repetitive jobs: migrations, audits, sweeps.","Save the workflow as code and reuse it."],
      apply:"Find one large, repetitive job you would never start by hand. That is the one to pilot as a dynamic workflow.",
      check:{q:"When is a dynamic workflow the right tool instead of a single agent?",a:"When the job is large and made of a repeatable unit done many times, like a migration across many repos or an audit of every service. The fleet runs them in parallel in a deterministic structure, with a verify pass, far faster than one agent in sequence."} },
  ]},
  { m:"Module 6", title:"Reading the Frontier", blurb:"How to interpret capability signals without the hype.", lessons:[
    { id:"6.1", title:"Vibe benchmarks",
      teach:`<p>A frontier model playing Pokemon by vision alone, running a Factorio base, simulating the solar system to predict an eclipse, or designing a 3D-printable model in a CAD editor it helped build, looks like a stunt. It is actually an evaluation. Each one tests long-horizon autonomy, vision, and world-modeling under messy, open-ended conditions that a single prompt-and-answer benchmark cannot.</p>
      <p>These playful demos predict business value better than a single score, because real work is long, tool-heavy, multimodal, and ambiguous, exactly like a game. Read them as evidence of staying power and judgment, not as party tricks.</p>`,
      take:["Capability demos are open-ended evals in disguise.","Games test the same traits real work needs: endurance, vision, judgment.","Read them as signal, not spectacle."],
      apply:"Keep your own \"vibe benchmark\": one messy, open-ended task you re-run on each new model. When it starts passing, something real changed.",
      check:{q:"Why might a model playing a game tell you more than a single benchmark score?",a:"Because games are long, open-ended, tool-heavy, and multimodal, like real work. They test sustained autonomy and judgment, which a one-shot benchmark cannot, so they are a better signal of what the model can actually carry."} },
    { id:"6.2", title:"Benchmarks that measure endurance",
      teach:`<p>Something changed in how benchmarks separate models. On classic single-task sets the field is compressed; the leaders sit within a few points. On long-horizon sets the gaps explode. The same model can lead a standard suite by single digits and a hard, multi-step set by double digits or more.</p>
      <p>The lesson: when a benchmark measures staying on task for hours with tools, rather than answering one question, it finally measures the thing buyers actually pay for, and the leaderboard reshuffles. Treat vendor numbers as a ceiling, not a promise, but watch the long-horizon gaps, because that is where real differences live now.</p>`,
      take:["Single-task scores are compressed; long-horizon gaps are wide.","Endurance benchmarks track what buyers actually pay for.","Vendor numbers are ceilings; weight the long-horizon ones."],
      apply:"When you compare models, look past the headline single-task score to a long-horizon or agentic result. That gap is the one that maps to your work.",
      check:{q:"Why do long-horizon benchmarks separate models more than classic ones?",a:"Classic single-task scores have compressed near the top, so everyone looks similar. Long-horizon tasks test sustained, multi-step, tool-using work where real capability differences show up, so the gaps widen and the ranking changes."} },
    { id:"6.3", title:"Capability and safeguards",
      teach:`<p>The strongest models now ship in two forms: an unrestricted version for vetted users, and a generally available version with safeguards on. The safeguard approach worth understanding: when a request touches sensitive areas like cybersecurity, biology, or chemistry, it is routed to a different, also-capable model instead, the response is labeled, and it is priced accordingly.</p>
      <p>This is a deliberate trade. It lets a frontier model reach everyone now, instead of months from now, at the cost of occasionally rerouting legitimate work in those fields. As a practitioner, know which of your use cases might trip the reroute, and that the safeguard is a feature of access, not a bug.</p>`,
      take:["Frontier models ship restricted and general-availability variants.","Sensitive requests get routed to a safer model and labeled.","The trade buys everyone access now, at some friction in those fields."],
      apply:"Check whether any of your use cases touch the sensitive categories. If so, expect occasional reroutes and plan for the labeled fallback.",
      check:{q:"What is the trade-off behind routing sensitive requests to a different model?",a:"It lets the most capable model ship to everyone immediately rather than waiting months, in exchange for sometimes rerouting legitimate researchers' work in cybersecurity, biology, or chemistry to a safer fallback."} },
    { id:"6.4", title:"The vertical agent era",
      teach:`<p>The market moved from horizontal chat to vertical agents that do a profession's actual work end to end: legal drafting and review, financial analysis, go-to-market engineering, security triage. These are not chatbots with a domain prompt; they own a workflow and return professional-grade deliverables.</p>
      <p>What separates the ones that ship in regulated fields from the ones that stall is not a better model. It is a rubric and a verification step: a clear definition of good and a way to prove the output met it. The whole course lands here. Vertical agents work when someone set the bar and the system holds it.</p>`,
      take:["Vertical agents own a profession's workflow, not just chat.","Shipping in regulated fields needs a rubric and verification.","Set the bar, hold the bar, is what makes them production-grade."],
      apply:"Pick a workflow in your field. Write the rubric a vertical agent would have to meet to be trusted with it. That rubric is the real product.",
      check:{q:"What separates a vertical agent that ships in a regulated field from one that stalls?",a:"Not the model, but a rubric and a verification step: a clear definition of good and a way to prove the output met it. Setting and holding that bar is what makes the agent trustworthy enough to deploy."} },
  ]},
];

// ---- app ----
const content = document.getElementById('content');
const nav = document.getElementById('nav');
const allLessons = COURSE.flatMap(m => m.lessons.map(l => ({...l, mod:m.title})));
const KEY = 'age-of-agents-progress';
let done = new Set(JSON.parse(localStorage.getItem(KEY) || '[]'));
let current = null; // null = home

function save(){ localStorage.setItem(KEY, JSON.stringify([...done])); }
function pct(){ return allLessons.length ? Math.round(done.size/allLessons.length*100) : 0; }
function updateProgress(){
  document.getElementById('progfill').style.width = pct()+'%';
  document.getElementById('progtxt').textContent = done.size+' of '+allLessons.length+' lessons';
}
function buildNav(){
  nav.innerHTML = '';
  COURSE.forEach((m,mi)=>{
    const md = document.createElement('div'); md.className='mod';
    md.innerHTML = '<div class="modh">'+m.m+' · '+m.title+'</div>';
    m.lessons.forEach(l=>{
      const el = document.createElement('div');
      el.className = 'lesson'+(done.has(l.id)?' done':'')+(current===l.id?' active':'');
      el.innerHTML = '<span class="tick">'+(done.has(l.id)?'✓':'')+'</span><span>'+l.id+'  '+l.title+'</span>';
      el.onclick = ()=>{ openLesson(l.id); };
      md.appendChild(el);
    });
    nav.appendChild(md);
  });
}
function renderHome(){
  current = null;
  let cards = COURSE.map((m,i)=>'<div class="modcard" data-first="'+m.lessons[0].id+'"><div class="mn">'+m.m+'</div><h3>'+m.title+'</h3><p>'+m.blurb+'</p><div class="cnt">'+m.lessons.length+' lessons</div></div>').join('');
  content.innerHTML =
    '<div class="hero"><img src="hero.png" alt="Six course modules as ascending steps, the final one in coral"></div>'+
    '<h1 class="h1">Working in the Age of Agents</h1>'+
    '<p class="lead">A practitioner\'s course on building and running systems that work on their own. Six modules, '+allLessons.length+' lessons, one throughline: set the bar before the work, hold the bar after it, and let the agents cross the middle.</p>'+
    '<button class="startbtn" id="startbtn">Start the course</button>'+
    '<div class="modcards">'+cards+'</div>';
  content.querySelector('#startbtn').onclick = ()=>openLesson(allLessons[0].id);
  content.querySelectorAll('.modcard').forEach(c=> c.onclick = ()=>openLesson(c.dataset.first));
  buildNav();
  window.scrollTo(0,0);
}
function openLesson(id){
  const idx = allLessons.findIndex(l=>l.id===id);
  const l = allLessons[idx];
  current = id;
  const takes = l.take.map(t=>'<li>'+t+'</li>').join('');
  const prev = idx>0 ? allLessons[idx-1] : null;
  const next = idx<allLessons.length-1 ? allLessons[idx+1] : null;
  content.innerHTML =
    '<div class="crumb">'+l.mod+' · Lesson '+l.id+'</div>'+
    '<h1 class="ltitle">'+l.title+'</h1>'+
    '<div class="teach">'+l.teach+'</div>'+
    '<div class="box"><h4>Key takeaways</h4><ul>'+takes+'</ul></div>'+
    '<div class="box apply"><h4>Apply it</h4><p>'+l.apply+'</p></div>'+
    '<div class="box check"><h4>Check yourself</h4><div class="q">'+l.check.q+'</div><button class="revbtn" id="rev">Show answer</button><div class="answer" id="ans">'+l.check.a+'</div></div>'+
    '<div class="lfoot">'+
      '<button class="markbtn'+(done.has(id)?' done':'')+'" id="mark">'+(done.has(id)?'✓ Completed':'Mark complete')+'</button>'+
      '<div class="nav">'+
        '<button id="prev"'+(prev?'':' disabled')+'>‹ Prev</button>'+
        '<button id="next"'+(next?'':' disabled')+'>'+(next?'Next ›':'Done')+'</button>'+
      '</div>'+
    '</div>';
  content.querySelector('#rev').onclick = (e)=>{ document.getElementById('ans').classList.toggle('show'); e.target.textContent = document.getElementById('ans').classList.contains('show')?'Hide answer':'Show answer'; };
  content.querySelector('#mark').onclick = ()=>{
    if(done.has(id)) done.delete(id); else done.add(id);
    save(); updateProgress(); buildNav();
    const b=document.getElementById('mark');
    b.classList.toggle('done', done.has(id));
    b.textContent = done.has(id)?'✓ Completed':'Mark complete';
  };
  if(prev) content.querySelector('#prev').onclick=()=>openLesson(prev.id);
  if(next) content.querySelector('#next').onclick=()=>openLesson(next.id);
  buildNav();
  document.getElementById('side').classList.remove('open');
  window.scrollTo(0,0);
}
document.getElementById('homebtn').onclick = renderHome;
document.getElementById('reset').onclick = ()=>{ if(confirm('Reset your progress?')){ done=new Set(); save(); updateProgress(); current===null?renderHome():openLesson(current); } };
document.getElementById('mobtoggle').onclick = ()=> document.getElementById('side').classList.toggle('open');

// theme
(function(){
  const bar=document.getElementById('toggle'), btns=bar.querySelectorAll('button');
  const mq=window.matchMedia('(prefers-color-scheme: dark)');
  function apply(mode){
    const t = mode==='system' ? (mq.matches?'dark':'light') : mode;
    document.documentElement.setAttribute('data-theme',t);
    btns.forEach(b=>b.classList.toggle('active', b.dataset.t===mode));
    try{localStorage.setItem('age-theme',mode);}catch(e){}
  }
  btns.forEach(b=> b.onclick=()=>apply(b.dataset.t));
  mq.addEventListener('change',()=>{ if((localStorage.getItem('age-theme')||'light')==='system') apply('system'); });
  apply((function(){try{return localStorage.getItem('age-theme')||'light'}catch(e){return 'light'}})());
})();

updateProgress();
renderHome();
</script>
</body>
</html>
